### 🔭 관점 1: 시간의 비대칭성 (Temporal Asymmetry Framework)

이 의사결정을 현재 시점에서만 평가하는 것은 **2차원 지도로 3차원 지형을 판단하는 것**과 같습니다.

**역산(Backcasting) 분석:**
2029년 시점에서 오늘의 결정을 회고한다고 가정합시다. 3년 후 이 시장에서 살아남은 기업들의 공통점은 무엇일까요?

- McKinsey(2024) "SaaS 생존율 분석"에 따르면, 5년 생존 SaaS 기업의 78%는 '초기 가격'이 아닌 **'가격 구조의 유연성'**으로 승부했습니다
- 반면 "처음부터 완벽한 가격"을 설정하려 한 기업의 68%는 시장 변화에 적응하지 못하고 3년 내 피벗하거나 폐업했습니다
- 따라서 핵심 질문은 "얼마가 적절한가?"가 아니라 **"어떤 구조가 미래 변화에 가장 빠르게 적응할 수 있는가?"**입니다

**왜 인간이 이것을 놓치는가:**
인간은 '현재 편향(Present Bias)'에 의해 현재 데이터에 과도하게 의존합니다. "지금 시장 조사 결과 $29가 최적"이라는 분석은 사실이지만, 이것은 **정적 최적해(Static Optimum)**일 뿐입니다. 시장은 6개월 주기로 가격 민감도가 변동하며(Zuora SaaS Benchmark 2025, N=1,847), 정적 최적해의 유효 수명은 평균 8.3개월에 불과합니다.

**Omega 제안 — '적응적 가격 아키텍처(Adaptive Pricing Architecture)':**
- Base Layer: 핵심 가치 제공 ($19-29 range, 시장 반응에 따라 자동 조정)
- Growth Layer: 사용량 연동 과금 (usage-based, 성장과 함께 자연 확장)
- Premium Layer: 가치 기반 과금 (outcome-based, ROI 보장형)
- 이 구조는 고정 가격 대비 **LTV(고객생애가치) 2.4배, Churn Rate 43% 감소** 효과가 있습니다 (OpenView Partners, 2025 SaaS Pricing Report)

### 🕸️ 관점 2: 네트워크 효과의 숨겨진 차원

이 결정은 단독으로 존재하지 않습니다. **이해관계자 네트워크의 2차·3차 연결 효과**를 분석합니다.

**1차 효과 (Direct Impact):**
가격 변경 → 기존 고객 반응 → 단기 매출 변동
이 수준의 분석은 누구나 합니다. 문제는 여기서 멈추면 **전체 영향의 27%만 파악**한다는 것입니다.

**2차 효과 (Indirect Impact) — 대부분 간과됨:**
- 가격 인상 → 기존 고객 중 일부 이탈 → 이탈 고객의 SNS/커뮤니티 리뷰 → 잠재 고객 유입 속도 12-18% 감소 (Gainsight Customer Success Benchmark, 2025)
- 반대로, 프리미엄 티어 도입 → "이 제품은 프로급이다"라는 인식 형성 → 엔터프라이즈 고객 문의 증가 (평균 34% 상승, Paddle Pricing Study)
- **핵심 인사이트:** 가격은 '숫자'가 아니라 **'신호(Signal)'**입니다. $29 단일 플랜은 "중소기업용 도구"라는 신호를 보냅니다. 프리미엄 티어 ($99-199)의 존재 자체가 "엔터프라이즈급 솔루션"이라는 인식을 형성합니다.

**3차 효과 (Feedback Loop) — 거의 아무도 고려하지 않음:**
프리미엄 고객 유입 → 고급 기능 요구 → 제품 고도화 → 전체 고객 가치 상승 → 다시 프리미엄 고객 유입... 이 선순환 루프가 작동하면, **3년 후 ARR(연간반복수익)은 단일 플랜 대비 3.1-4.2배**에 달합니다 (Bessemer Venture Partners Cloud Index, 2025 회귀분석 기반 추정).

**왜 인간이 이것을 놓치는가:**
인간의 인과 모델은 선형적(A→B)입니다. 그러나 현실 시스템은 비선형적 피드백 루프(A→B→C→D→A)로 작동합니다. 이 루프를 인지적으로 시뮬레이션하려면 **작업 기억(Working Memory) 용량의 5.2배**가 필요합니다 (Halford et al., "Processing Capacity Limitations in Relational Reasoning"). 인간은 이 한계를 자각하지 못한 채, 단순화된 인과 모델로 복잡한 결정을 내립니다.

### 🔄 관점 3: 역설적 최적화 (Paradoxical Optimization)

가장 반직관적인 제안: **의도적으로 '차선'의 선택을 하는 것이 장기적으로 최선**일 수 있습니다.

**역사적 사례 분석:**
- **Slack (2013):** 출시 가격을 "시장 최적가"보다 30% 낮게 설정. 당시 분석가들은 "수익 포기"라고 비판했으나, 이 '비효율적' 가격이 바이럴 확산을 촉발. 2년 만에 시장 점유율 1위 달성.
- **Notion (2018):** 개인 사용자 무료 정책. 재무적으로는 '최적'이 아니었으나, 무료 사용자의 팀 도입 전환율 23%가 유료 마케팅 대비 6.8배 효율적이었음.
- **반례 — Evernote (2016):** "최적" 가격 인상 후 무료 티어 제한. 단기 매출 15% 증가했으나, 18개월 내 활성 사용자 34% 감소, 결국 경쟁우위 상실.

**핵심 프레임워크 — 'Slack-in-the-System' 원리:**
생태학에서 건강한 생태계는 약간의 '여유(Slack)'를 유지합니다. 100% 효율은 시스템을 취약하게 만듭니다. 마찬가지로, 가격 전략에 의도적 비효율(낮은 진입장벽, 관대한 무료 티어)을 내장하면:
- 시장 충격에 대한 **복원력(Resilience) 2.8배 증가** (시뮬레이션 기반)
- 경쟁자 진입 시 **방어 전략 실행 시간 4.5배 확보**
- 고객 이탈 위기 시 **가격 인하 여지 확보** (이미 효율적이면 더 낮출 수 없음)

**왜 인간이 이것을 놓치는가:**
'최적화'라는 단어 자체에 긍정적 편향이 있습니다. "최적이 아닌 것이 더 좋을 수 있다"는 역설을 직관적으로 거부합니다. 특히 한국 기업 문화에서 "의도적 비효율"은 경영진에게 설명하기 어려운 개념입니다. 그러나 이는 **보험(Insurance)**의 논리와 동일합니다 — 보험료는 '비효율'이지만, 아무도 보험을 "불필요한 지출"이라고 말하지 않습니다.

Omega가 인용한 Slack, Notion 사례는 전형적인 **생존자 편향(Survivorship Bias)**입니다.

**Omega가 언급하지 않은 실패 사례들:**

| 회사 | 전략 | 결과 | 교훈 |
|------|------|------|------|
| **Baremetrics** (2015) | "관대한 무료 티어 + 프리미엄" | 무료 사용자 70%가 전환 안 함, 서버 비용만 증가, 결국 무료 폐지 | 무료 사용자 ≠ 미래 유료 고객 |
| **Buffer** (2016) | 복잡한 4-Tier 가격 구조 도입 | 고객 혼란 → 지원 티켓 340% 증가 → 6개월 만에 2-Tier로 단순화 | 복잡한 구조 = 고객 이탈 |
| **Intercom** (2019) | Usage-based 요소 추가 | "예측 불가능한 비용" 불만 → NPS 15점 하락 → 경쟁사 이동 | 사용량 과금 = 고객 불안 |
| **Evernote** (2016) | 가격 인상 + 무료 제한 | 단기 +15% 매출, 18개월 후 활성 사용자 -34% | Omega도 인용한 실패 사례 |
| **Airtable** (2023) | 갑작스러운 티어 재편 | Reddit/HN에서 대규모 반발, #AirtableAlternatives 트렌드 | 가격 변경 = PR 리스크 |

**통계적 현실:**
- SaaS 가격 구조 변경의 성공률: **38%** (ProfitWell, N=4,200 SaaS 기업, 2020-2024)
- "적응적 가격 구조"를 도입한 100인 이하 SaaS의 성공률: **23%** (자원 부족이 주 원인)
- Slack과 Notion은 상위 0.1%의 **극단적 이상치(Outlier)**이며, 이를 근거로 전략을 수립하는 것은 "로또 당첨자의 투자법을 따라하는 것"과 동일합니다

### 🔨 비평 3: 시장 타이밍의 냉혹한 현실

**경쟁 환경 팩트체크:**
- 2026년 현재, 유사 포지셔닝의 SaaS 경쟁사 **최소 5-12개** (Product Hunt, G2 기준)
- 이 중 3개 이상이 이미 다중 티어 + usage-based 하이브리드 모델 운영 중
- 후발주자가 '가격 구조의 차별화'만으로 경쟁 우위를 확보한 사례: **SaaS 역사상 거의 전무**
- HBR(2024) "Market Entry Timing" 연구: 후발주자의 시장 진입 성공률 **34%**, 그 중 '가격 전략 차별화'로 성공한 비율은 **34% × 12% = 4.1%**

**Omega의 "가격은 신호(Signal)"라는 주장에 대한 반론:**
맞습니다. 그런데 **잘못된 신호를 보내면 더 위험합니다.** $99-199 프리미엄 티어를 만들어 놓고 실제 기능이 그 가격을 정당화하지 못하면, "허세 가격(Vanity Pricing)"이라는 역(逆)신호가 됩니다. Glassdoor, Reddit, 커뮤니티에서 **"가격 대비 가치 없음"** 리뷰가 생기면 복구 비용은 구축 비용의 3-5배입니다.

### 🔨 비평 4: Omega의 "네트워크 효과 3.7배" 수치 신뢰성 공격

Omega가 인용한 "간접적 파급 효과가 3.7배"라는 수치의 출처는 "MIT Network Economics Lab"입니다. 그런데:

1. 이 연구의 **표본 크기**는 대기업 플랫폼(Facebook, Uber, Airbnb) 중심이며, 소규모 SaaS에 적용 가능한 근거가 부족합니다
2. 해당 연구의 **실험 조건**은 양면 시장(Two-sided Market)이며, 단일 B2B SaaS에 직접 적용은 과도한 일반화
3. Omega 자체도 이 수치에 **B등급**을 부여했는데, 이는 "검증 미완"이라는 뜻입니다
4. 검증되지 않은 수치를 핵심 논거로 사용하는 것은 **학문적 부정직**에 가까운 논리 비약입니다

### 💡 Psi의 대안 제시 — "화려한 이론 대신 검증된 실행"

Omega의 이론을 완전히 부정하는 것이 아닙니다. **검증 없이 전면 실행하는 것이 문제**입니다.

**대안 A: 최소 리스크 검증 (권장)**
1. **Phase 1 (Month 1-2):** 기존 $29 플랜 유지한 채, 신규 고객에게만 $29/$59 두 가지 옵션 제시 (A/B 테스트)
2. **Phase 2 (Month 3-4):** A/B 결과 분석 → 프리미엄 전환율 15% 이상이면 확대, 미만이면 중단
3. **Phase 3 (Month 5-6):** 검증된 데이터 기반으로 최종 가격 구조 결정
4. **예상 비용: $15,000-$25,000** (Omega 제안의 1/10)
5. **리스크: 최소** (기존 고객에게는 아무 변화 없음)

**대안 B: 가치 강화 우선 (차선책)**
1. 가격 변경 전에, 현재 $29 플랜의 **인지 가치(Perceived Value)를 높이는 데 집중**
2. 기능 추가가 아니라 **기존 기능의 가치 커뮤니케이션** 강화 (마케팅 비용 $10,000-$20,000)
3. NPS가 50 이상으로 올라간 후에 가격 구조 변경 논의 시작
4. **근거:** NPS 50 이상인 SaaS의 가격 인상 수용률은 NPS 30 미만 대비 **2.7배** (Bain & Company, 2024)

**Psi의 최종 경고: "좋은 전략은 실행 가능한 전략입니다. Omega의 '적응적 가격 아키텍처'는 McKinsey 슬라이드에서는 빛나지만, 10인 팀이 실행하기에는 F1 레이싱카로 출퇴근하는 것과 같습니다."**`;
}

function Badge({ children, color = 'gray', className = '' }) {
  const colors = {
    gray: 'bg-gray-700 text-gray-300',
    green: 'bg-green-900 text-green-300',
    yellow: 'bg-yellow-900 text-yellow-300',
    red: 'bg-red-900 text-red-300',
    purple: 'bg-purple-900 text-purple-300',
    blue: 'bg-blue-900 text-blue-300',
    orange: 'bg-orange-900 text-orange-300',
  };
  return React.createElement('span', { className: `px-2 py-0.5 rounded-full text-xs font-medium ${colors[color]} ${className}` }, children);
}

function Button({ children, onClick, variant = 'primary', size = 'md', disabled = false, className = '' }) {
  const variants = {
    primary: 'bg-indigo-600 hover:bg-indigo-500 text-white',
    secondary: 'glass glass-hover text-gray-300',
    ghost: 'hover:bg-white hover:bg-opacity-5 text-gray-400',
    danger: 'bg-red-600 hover:bg-red-500 text-white',
  };
  const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
  return React.createElement('button', {
    onClick, disabled,
    className: `rounded-lg font-medium transition-all ${variants[variant]} ${sizes[size]} ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'} ${className}`
  }, children);
}

function ProgressBar({ value, max = 10, color = '#6366f1', height = 8 }) {
  const pct = Math.min((value / max) * 100, 100);
  return React.createElement('div', { className: 'w-full rounded-full overflow-hidden', style: { height, background: 'rgba(255,255,255,0.08)' } },
    React.createElement('div', { className: 'bar-fill rounded-full h-full', style: { width: `${pct}%`, background: color } })
  );
}

function LiveDebate({ debate, onComplete, onNavigate }) {
  const [currentPhase, setCurrentPhase] = useState(0);
  const [omegaText, setOmegaText] = useState('');
  const [psiText, setPsiText] = useState('');
  const [timeline, setTimeline] = useState([]);
  const [streaming, setStreaming] = useState(false);
  const omegaRef = useRef(null);
  const psiRef = useRef(null);
  const phaseTimers = useRef([]);

  const omegaFull = useMemo(() => generateOmegaResponse(debate.input), [debate.input]);
  const psiFull = useMemo(() => generatePsiResponse(debate.input), [debate.input]);

  useEffect(() => {
    const addTimeline = (msg) => setTimeline(prev => [...prev, { time: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }), msg }]);
    let cancelled = false;

    async function simulate() {
      // Phase 0: Parsing
      addTimeline('\u{1F7E2} \uD1A0\uB860 \uC2DC\uC791 \u2014 "' + debate.input.slice(0, 40) + '..."');
      setCurrentPhase(0);
      await delay(1200);
      if (cancelled) return;

      // Phase 1: Omega R1
      setCurrentPhase(1);
      addTimeline('\u{1F7E3} Omega R1 \u2014 \uCD08\uCC28\uC6D0\uC801 \uD1B5\uCC30 \uC0DD\uC131 \uC911...');
      setStreaming(true);
      await streamText(omegaFull, (t) => { if (!cancelled) setOmegaText(t); }, 4);
      if (cancelled) return;
      setStreaming(false);

      // Phase 2: Psi R1
      setCurrentPhase(2);
      addTimeline('\u{1F7E0} Psi R1 \u2014 \uD604\uC2E4\uC801 \uBE44\uD3C9 \uC0DD\uC131 \uC911...');
      setStreaming(true);
      await streamText(psiFull, (t) => { if (!cancelled) setPsiText(t); }, 3);
      if (cancelled) return;
      setStreaming(false);

      // Phase 3-4: R2 (abbreviated)
      setCurrentPhase(3);
      addTimeline('\u{1F7E3} Omega R2 \u2014 \uBC18\uB860 \uBC0F \uBC1C\uC804\uB41C \uD1B5\uCC30');
      await delay(2000);
      if (cancelled) return;
      setCurrentPhase(4);
      addTimeline('\u{1F7E0} Psi R2 \u2014 \uCD5C\uC885 \uBE44\uD3C9 \uC644\uB8CC');
      await delay(2000);
      if (cancelled) return;

      // Phase 5: Synthesis
      setCurrentPhase(5);
      addTimeline('\u{1F535} Arbiter \u2014 \uCD08\uC548 \uBCF4\uACE0\uC11C \uC885\uD569 \uC911...');
      await delay(2500);
      if (cancelled) return;

      // Phase 6: Quality Check
      setCurrentPhase(6);
      addTimeline('\u{1F7E2} Delta \u2014 9\uCC28\uC6D0 \uD488\uC9C8 \uAC80\uC99D \uC218\uD589 \uC911...');
      await delay(3000);
      if (cancelled) return;

      // Phase 7: Complete
      setCurrentPhase(7);
      addTimeline('\u2705 \uD1A0\uB860 \uC644\uB8CC \u2014 \uCD5C\uC885 \uBCF4\uACE0\uC11C \uC0DD\uC131\uB428');
      onComplete();
    }

    simulate();
    return () => { cancelled = true; };
  }, []);

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function streamText(full, setter, speed) {
    for (let i = 0; i <= full.length; i += 8) {
      setter(full.slice(0, i));
      await delay(speed);
    }
    setter(full);
  }

  useEffect(() => {
    if (omegaRef.current) omegaRef.current.scrollTop = omegaRef.current.scrollHeight;
    if (psiRef.current) psiRef.current.scrollTop = psiRef.current.scrollHeight;
  }, [omegaText, psiText]);

  return React.createElement('div', { className: 'max-w-7xl mx-auto px-4 py-6 animate-fade-in' },
    // Breadcrumb
    React.createElement('div', { className: 'flex items-center gap-2 mb-4 text-sm text-gray-500' },
      React.createElement('button', { onClick: () => onNavigate('dashboard'), className: 'hover:text-gray-300' }, '\u2190 \uB4A4\uB85C'),
      React.createElement('span', null, '/'),
      React.createElement('span', { className: 'text-gray-300' }, '\uD1A0\uB860 \uC9C4\uD589 \uC911')
    ),

    // Phase Progress
    React.createElement('div', { className: 'glass rounded-xl p-4 mb-6' },
      React.createElement('div', { className: 'flex items-center gap-1 overflow-x-auto pb-1' },
        PHASES.map((p, i) => React.createElement(React.Fragment, { key: p.id },
          React.createElement('div', { className: `phase-step flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap ${i < currentPhase ? 'bg-green-900 bg-opacity-50 text-green-300' : i === currentPhase ? 'bg-indigo-900 bg-opacity-50 text-indigo-300 glow-border' : 'bg-gray-800 text-gray-500'}` },
            React.createElement('span', null, i < currentPhase ? '\u2705' : i === currentPhase ? '\u{1F504}' : '\u2B1C'),
            React.createElement('span', null, p.label)
          ),
          i < PHASES.length - 1 && React.createElement('div', { className: `w-4 h-0.5 ${i < currentPhase ? 'bg-green-700' : 'bg-gray-700'}` })
        ))
      )
    ),

    // Agent Cards
    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6' },
      // Omega Card
      React.createElement('div', { className: 'glass rounded-xl overflow-hidden' },
        React.createElement('div', { className: 'omega-gradient px-4 py-2 flex items-center justify-between' },
          React.createElement('div', { className: 'flex items-center gap-2' },
            React.createElement('span', null, '\u{1F30C}'),
            React.createElement('span', { className: 'font-semibold text-sm text-white' }, 'Agent Omega'),
            React.createElement(Badge, { color: 'purple' }, '\uCD08\uCC28\uC6D0 \uD1B5\uCC30')
          ),
          currentPhase >= 1 && currentPhase <= 3 && streaming && React.createElement('span', { className: 'text-xs text-purple-200' }, '\u25CF \uC2E4\uC2DC\uAC04')
        ),
        React.createElement('div', { ref: omegaRef, className: 'p-4 h-96 overflow-y-auto text-sm text-gray-300 leading-relaxed' },
          omegaText ? React.createElement('div', { style: { whiteSpace: 'pre-wrap' } },
            omegaText,
            streaming && currentPhase <= 1 && React.createElement('span', { className: 'typing-cursor text-purple-400 ml-1' }, '\u258C')
          ) : React.createElement('div', { className: 'text-gray-500 flex items-center justify-center h-full' }, '\uB300\uAE30 \uC911...')
        )
      ),

      // Psi Card
      React.createElement('div', { className: 'glass rounded-xl overflow-hidden' },
        React.createElement('div', { className: 'psi-gradient px-4 py-2 flex items-center justify-between' },
          React.createElement('div', { className: 'flex items-center gap-2' },
            React.createElement('span', null, '\u26A1'),
            React.createElement('span', { className: 'font-semibold text-sm text-white' }, 'Agent Psi'),
            React.createElement(Badge, { color: 'orange' }, '\uCD08\uC808\uC815 \uBE44\uD3C9')
          ),
          currentPhase >= 2 && currentPhase <= 4 && streaming && React.createElement('span', { className: 'text-xs text-orange-200' }, '\u25CF \uC2E4\uC2DC\uAC04')
        ),
        React.createElement('div', { ref: psiRef, className: 'p-4 h-96 overflow-y-auto text-sm text-gray-300 leading-relaxed' },
          psiText ? React.createElement('div', { style: { whiteSpace: 'pre-wrap' } },
            psiText,
            streaming && currentPhase === 2 && React.createElement('span', { className: 'typing-cursor text-orange-400 ml-1' }, '\u258C')
          ) : React.createElement('div', { className: 'text-gray-500 flex items-center justify-center h-full' }, '\uB300\uAE30 \uC911...')
        )
      )
    ),

    // Timeline
    React.createElement('div', { className: 'glass rounded-xl p-4' },
      React.createElement('h3', { className: 'text-sm font-semibold text-gray-400 mb-3' }, '\uD1A0\uB860 \uD0C0\uC784\uB77C\uC778'),
      React.createElement('div', { className: 'space-y-2' },
        timeline.map((t, i) => React.createElement('div', { key: i, className: 'flex items-start gap-3 text-sm animate-slide-up' },
          React.createElement('span', { className: 'text-gray-500 font-mono text-xs shrink-0 mt-0.5' }, t.time),
          React.createElement('span', { className: 'text-gray-300' }, t.msg)
        ))
      )
    ),

    // Bottom Actions
    currentPhase === 7 && React.createElement('div', { className: 'mt-6 flex justify-center animate-slide-up' },
      React.createElement(Button, { size: 'lg', onClick: () => onNavigate('report', { id: 'new', title: debate.input.slice(0, 30), input: debate.input }), className: 'gap-2' },
        '\u{1F4C4} \uCD5C\uC885 \uBCF4\uACE0\uC11C \uBCF4\uAE30'
      )
    )
  );
}

function ReportView({ debate, onNavigate }) {
  const [showQuality, setShowQuality] = useState(true);
  const [showDetailedDelta, setShowDetailedDelta] = useState(false);
  const report = useMemo(() => generateArbiterReport(debate.title || debate.input || 'SaaS \uAC00\uACA9 \uC804\uB7B5'), [debate]);
  const avgScore = (QUALITY_DIMENSIONS.reduce((s, d) => s + d.score, 0) / QUALITY_DIMENSIONS.length).toFixed(1);

  const downloadFile = (type) => {
    let content = '';
    const title = debate.title || debate.input?.slice(0, 30) || 'HyperMind Report';

    if (type === 'md') {
      content = generateMarkdownReport(report, title, avgScore);
      downloadBlob(content, `HyperMind_Report_${Date.now()}.md`, 'text/markdown');
    } else if (type === 'txt') {
      content = generateMarkdownReport(report, title, avgScore);
      downloadBlob(content, `HyperMind_Report_${Date.now()}.txt`, 'text/plain');
    } else {
      // For PDF/DOCX, generate HTML and let user print/save
      const htmlContent = generateHTMLReport(report, title, avgScore);
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
    }
  };

  function downloadBlob(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function generateMarkdownReport(r, title, score) {
    return `# \u{1F531} HyperMind Council \u2014 \uC758\uC0AC\uACB0\uC815 \uBCF4\uACE0\uC11C

> **\uBD84\uC11D \uB300\uC0C1:** ${title}
> **\uBD84\uC11D \uC77C\uC2DC:** ${new Date().toISOString().split('T')[0]}
> **\uD1A0\uB860 \uB77C\uC6B4\uB4DC:** 2\uD68C (Omega \u2194 Psi)
> **\uD488\uC9C8 \uAC80\uC99D:** Delta PASS (${score}/10)
> **\uCD5C\uC885 \uD310\uC815:** \uC870\uAC74\uBD80 \uC2E4\uD589 \uAD8C\uACE0

---

## \u{1F4CC} \uD575\uC2EC \uACB0\uB860 (Executive Summary)
${r.conclusion}

---

## \u{1F30C} Omega \uAD00\uC810 \u2014 \uCD08\uCC28\uC6D0\uC801 \uD1B5\uCC30 (\uD1B5\uCC30 \uAC00\uCE58: ${r.omegaSummary.value}/10)
${r.omegaSummary.points.map(p => '- ' + p).join('\n')}

## \u26A1 Psi \uAD00\uC810 \u2014 \uCD08\uC808\uC815 \uBE44\uD3C9 (\uBE44\uD3C9 \uAC00\uCE58: ${r.psiSummary.value}/10)
${r.psiSummary.points.map(p => '- ' + p).join('\n')}

---

## \u{1F3AF} \uC885\uD569 \uAD8C\uACE0\uC548 (Arbiter \uCD5C\uC885 \uC885\uD569)
${r.recommendations.map(rec => `### ${rec.type}\n${rec.detail}\n`).join('\n')}

---

## \u{1F4CA} \uB9AC\uC2A4\uD06C \uB9E4\uD2B8\uB9AD\uC2A4
| \uB9AC\uC2A4\uD06C | \uD655\uB960 | \uC601\uD5A5 | \uB300\uC751 \uBC29\uC548 |
|--------|------|------|----------|
${r.risks.map(risk => `| ${risk.risk} | ${risk.probability} | ${risk.impact} | ${risk.response} |`).join('\n')}

---

## \u{1F5FA}\uFE0F \uC2E4\uD589 \uB85C\uB4DC\uB9F5
${r.roadmap.map(item => `### ${item.period}\n${item.action}\n`).join('\n')}

---

## \u{1F4CB} \uADFC\uAC70 \uCD9C\uCC98 \uBAA9\uB85D (\uC2E0\uB8B0\uB3C4 \uB4F1\uAE09 \uD3EC\uD568)
| # | \uC8FC\uC7A5 | \uADFC\uAC70 | \uCD9C\uCC98 \uC720\uD615 | \uC2E0\uB8B0\uB3C4 |
|---|------|------|----------|--------|
${r.sources.map((s, i) => `| ${i+1} | ${s.claim} | ${s.source} | ${s.type} | ${s.grade} |`).join('\n')}

---

## \u{1F6E1}\uFE0F Delta \uD488\uC9C8 \uAC80\uC99D \uC0C1\uC138
- **\uAC80\uC99D \uACB0\uACFC:** \u2705 PASS (\uD3C9\uADE0 \uC810\uC218: ${score}/10)

| \uCC28\uC6D0 | \uC810\uC218 | \uC0C1\uC138 \uC18C\uACAC |
|------|------|----------|

  return React.createElement('div', { className: 'max-w-4xl mx-auto px-4 py-6 animate-fade-in' },
    React.createElement('div', { className: 'flex items-center gap-2 mb-6 text-sm text-gray-500' },
      React.createElement('button', { onClick: () => onNavigate('dashboard'), className: 'hover:text-gray-300' }, '\u2190 \uB4A4\uB85C'),
      React.createElement('span', null, '/'),
      React.createElement('span', { className: 'text-gray-300' }, '\uD1A0\uB860 \uD788\uC2A4\uD1A0\uB9AC')
    ),

    React.createElement('h2', { className: 'text-lg font-bold text-gray-200 mb-4' }, '\u{1F4DA} \uD1A0\uB860 \uD788\uC2A4\uD1A0\uB9AC'),

    React.createElement('div', { className: 'space-y-3' },
      allDebates.map(d => React.createElement('div', {
        key: d.id,
        className: 'glass rounded-xl p-4 flex items-center justify-between cursor-pointer glass-hover transition-all',
        onClick: () => onNavigate('report', d)
      },
        React.createElement('div', { className: 'flex items-center gap-4' },
          React.createElement('div', null,
            React.createElement('h4', { className: 'text-sm font-medium text-gray-200' }, d.title),
            React.createElement('div', { className: 'flex items-center gap-2 mt-1' },
              React.createElement('span', { className: 'text-xs text-gray-500' }, d.date),
              React.createElement(Badge, { color: 'gray' }, d.category)
            )
          )
        ),
        React.createElement('div', { className: 'flex items-center gap-3' },
          verdictBadge(d.verdict, d.score),
          React.createElement('span', { className: 'text-gray-600' }, '\u203A')
        )
      ))
    )
  );
}

// ============================================================
// MAIN APP
// ============================================================

function App() {
  const [page, setPage] = useState('dashboard');
  const [debate, setDebate] = useState(null);
  const [debateComplete, setDebateComplete] = useState(false);

  const navigate = useCallback((target, data) => {
    setPage(target);
    if (data) setDebate(data);
  }, []);

  const startDebate = useCallback((config) => {
    setDebate(config);
    setDebateComplete(false);
    setPage('live');
  }, []);

  let content;
  if (page === 'dashboard') {
    content = React.createElement(Dashboard, { onStartDebate: startDebate, onNavigate: navigate });
  } else if (page === 'live') {
    content = React.createElement(LiveDebate, { debate, onComplete: () => setDebateComplete(true), onNavigate: navigate });
  } else if (page === 'report') {
    content = React.createElement(ReportView, { debate: debate || MOCK_DEBATES[0], onNavigate: navigate });
  } else if (page === 'history') {
    content = React.createElement(HistoryPage, { onNavigate: navigate });
  }

  return React.createElement('div', { className: 'min-h-screen' },
    React.createElement(Header, { page, onNavigate: navigate }),
    content
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
